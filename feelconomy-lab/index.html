<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FEELCONOMY LAB — 내 데이터로 하는 소비 잠재수요 분석</title>
    <!--
      description은 v1 문구("감정점수 10개", "나와 비슷한 감정집단")가 그대로
      남아 있었다. v2에서 설계가 바뀌어 남의 데이터를 전혀 쓰지 않게 되었고
      욕구도 6개인데, 공유 미리보기에는 옛 설명이 나가고 있었다.
    -->
    <meta
      name="description"
      content="내가 원하는 것과 각 소비가 채워주는 것을 숫자로 입력하면, 오직 내 데이터만으로 SVD와 군집 분석이 그 자리에서 끝납니다. 대천대신고등학교 오량진 GBL 부스 교육용 데이터 분석 체험."
    />
    <link rel="icon" href="/branding/school-logo.png" />

    <!--
      링크·QR로 공유했을 때의 미리보기 카드.
      og:image와 og:url은 규격상 절대 URL이어야 해서 배포 주소를 직접 적었다.
      저장소 이름이나 계정이 바뀌면 이 두 줄도 함께 바꿔야 한다.
      (og-image.png는 public/branding/에 있고 1200×630 규격이다)
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="FEELCONOMY LAB" />
    <meta property="og:title" content="FEELCONOMY LAB — 내 데이터로 하는 소비 잠재수요 분석" />
    <meta
      property="og:description"
      content="내가 원하는 것과 각 소비가 채워주는 것을 숫자로 입력하면, 오직 내 데이터만으로 SVD와 군집 분석이 그 자리에서 끝납니다."
    />
    <meta property="og:url" content="https://j00ng.github.io/feelconomy-lab/" />
    <meta property="og:image" content="https://j00ng.github.io/feelconomy-lab/branding/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FEELCONOMY LAB — 대천대신고등학교 오량진 GBL 부스" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pretendard — index.css의 --font-sans가 참조하는 실제 웹폰트를 로드한다.
         이전에는 폰트 이름만 지정되어 있고 실제 로드가 없어 OS 기본 산세리프
         (Malgun Gothic 등)로 조용히 대체되고 있었다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
